services:
  db:
    image: postgres:16-alpine
    container_name: reparsystem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-reparsystem}
      POSTGRES_USER: ${DB_USER:-reparsystem}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in the ignored local .env file}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - reparsystem-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-reparsystem} -d ${DB_NAME:-reparsystem}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  reparsystem-postgres-data:
